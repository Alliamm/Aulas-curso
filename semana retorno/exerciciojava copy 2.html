<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <style>
        table td{
            height: 50px;
            width: 50px;
        }
        .preto{
            background-color: black;
        }
        .cinza{
            background-color: lightslategrey;
        }
    </style>
    <script>
        document.write(`<table>`);
        for(var i = 0; i < 8; i++){
            document.write(`<tr>`);
            if(i % 2 == 0){
                    var casa1 = "preto";
                    var casa2 = "cinza";
                }
            else{
                var casa1 = "cinza";
                var casa2 = "preto";
        }
            for(var j = 0; j < 8; j++){
                if( j % 2 == 0){
                    document.write(`<td class="${casa1}"></td>`);
            }
                else{
                    document.write(`<td class="${casa2}"/td>`);
                }
        }
        document.write(`</tr>`);
        }
    document.write(`</table>`);
    </script>
</body>
</html>
