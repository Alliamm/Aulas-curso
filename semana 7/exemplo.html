<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        var pessoas = Number(prompt("Digite número de pessoas"));
        for(var i = 0;i < pessoas; i++){
            var idade = Number(prompt(`Digite sua idade: (pessoa ${i+1})`))
            var nome = prompt(`Informe seu nome: (pessoa ${i+1})`);
            document.write(`Nome: ${nome}<br>`);
            document.write(`Idade: ${idade}<br>`);
            if(idade >= 18){
                document.write("Você é maior de idade<br>");
            }
            else {
                document.write("Você é menor de idade<br>");
            }
            document.write("<hr>");
    }
    document.write(`<br>Repetiu por ${i} vezes`);
    document.write("<br>Fim do programa");
    </script>
</body>
</html>
